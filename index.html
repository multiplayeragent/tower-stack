<script>
/* ═══ TOWER STACK · a Multiplayer Agent starter ═════════════════════════════════════════
 * Stack falling blocks with real physics. First tower to hold above the gold line wins.
 * Versus, 2–4 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ lane size, the finish line, fall speeds, lives, spells, bots
 *   PIECES ........ the seven block shapes and their colors
 *   PHYSICS ....... a small rigid-body solver for boxes (contacts, friction, sleeping)
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   TOWER ......... one player's tower: spawning, steering the falling piece, lives, the hold
 *   SPELLS ........ glue (yours), gust and iron (on your rivals)
 *   MATCH (HOST) .. countdown, who is out, the winner, the time limit, the restart
 *   BOTS (HOST) ... a bot looks at its tower's skyline and picks a steady spot
 *   ME ............ my tower: input, publishing
 *   DRAW .......... my lane large, rivals small, effects
 *   SCREENS ....... sound, hint, results, leaderboard, colors
 *   INPUT ......... keyboard (with key repeat), drag, tap and flick
 *   MAIN LOOP ..... heartbeat, host tick, my tick, draw
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Every tower is simulated by ONE browser: yours by you, the bots' by the host. Nobody
 *     else runs your physics; they draw the snapshot you publish.
 *   - Your tower is your OWN entity field `t` = {m, b, l, p, k, s, h, g, w, a, wd, ir}: match
 *     id, the blocks [id, shape, x, y, angle (×100), flags], lives, pieces placed, pieces
 *     dealt, spell held, height (×100), hold progress, when you won, alive, wind, iron next.
 *     ~11 times a second. Also `n` (name), `c` (color) and `hb` (heartbeat).
 *   - The HOST (lowest live sessionId) runs the match in ONE shared field, `match`: {id, v,
 *     ph, seed, startAt, raceEnd, players, bots, out, winner, endsAt, ready}. It reads every
 *     tower, marks who lost all lives and calls the winner. Each bot's tower lives in a shared
 *     field `bot1` … `bot4` (same shape as `t`); a new host rebuilds the bots from them.
 *   - Spells are events: "spell" {k, f, m, d}. Each player applies a gust or iron to its OWN
 *     tower when it hears one; the host applies them to its bots.
 *   - Everyone gets the same pieces in the same order: 7-piece bags shuffled from match.seed.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "fast-tower": your fastest time to the finish line.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 4,             // bots fill the match up to this many towers (2–4)
  laneHalf: 7,          // a lane is 14 cells wide (x from -7 to 7)
  baseHalf: 3,          // the stone base is 6 cells wide: blocks past its edge fall off
  viewBottom: -3.5, viewTop: 19, // the part of the lane on screen, in cells (the base top is 0)
  finishY: 13,          // the gold finish line, in cells above the base
  holdMs: 2000,         // your tower must stay above the line this long to win
  spawnY: 17,           // new pieces appear this high
  fallSpeed: 2.4,       // cells per second a piece floats down…
  softSpeed: 6.5,       // …while you hold down…
  dropSpeed: 14,        // …after you drop it…
  landSpeed: 4.5,       // …slowing to this just above the tower, so drops don't smash it
  nextDelayMs: 450,     // the next piece comes this long after one lands
  lives: 3,             // a block falling off costs a life; 0 lives = out
  collapseMs: 1500,     // more blocks falling within this long count as the same collapse (one life)
  lostY: -4,            // a block below this has fallen off
  raceMs: 180000,       // after 3 minutes the tallest tower wins
  countdownMs: 3000,    // 3, 2, 1, go
  overMs: 9000,         // the results screen
  spellEvery: 3,        // every 3rd piece you land charges a spell (you hold one at a time)
  windMs: 3200,         // a gust blows this long…
  windForce: 2.6,        // …this hard
  ironDens: 3.5,        // an iron piece is this many times heavier
  publishMs: 90,        // my tower snapshot at most this often
  botThinkMs: 1500,     // a bot looks at a new piece this long before moving it
  botTrials: 5,         // a bot test-drops its best few spots on a copy of its tower before choosing
  botMistake: 0.22,     // chance a bot settles for a worse spot
  botCastMs: [1500, 5000], // a bot casts a held spell after this long
  das: 170, arr: 60,    // key repeat: delay before it starts, then ms per step
  board: "fast-tower",  // leaderboard name
};
const BOT_NAMES = ["Merla", "Gandolf", "Hexa", "Wizbit", "Prisma", "Runa", "Bramble", "Stackwell"];
const COLORS = ["#ffd23f", "#4cc9f0", "#f72585", "#80ed99", "#ff9f1c", "#b388ff", "#ff6b6b", "#00f5d4"];
const SPELLS = { glue: { icon: "🌿", name: "Glue", say: "glued their tower" }, gust: { icon: "🌬️", name: "Gust", say: "sent a gust" }, iron: { icon: "⚙️", name: "Iron", say: "made your next piece iron" } };

// ── PIECES ──────────────────────────────────────────────────────────────────────────
// Each shape is a few rectangles [x, y, w, h] in cells (y up). Physics treats it as one body.
const PIECES = {
  I: { rects: [[0, 0, 4, 1]], color: "#38d6f5" },
  O: { rects: [[0, 0, 2, 2]], color: "#ffd23f" },
  T: { rects: [[0, 0, 3, 1], [1, 1, 1, 1]], color: "#b467ff" },
  S: { rects: [[0, 0, 2, 1], [1, 1, 2, 1]], color: "#4ee08a" },
  Z: { rects: [[1, 0, 2, 1], [0, 1, 2, 1]], color: "#ff5a6e" },
  J: { rects: [[0, 0, 3, 1], [0, 1, 1, 1]], color: "#4c7dff" },
  L: { rects: [[0, 0, 3, 1], [2, 1, 1, 1]], color: "#ff9f1c" },
};
/** A shape's boxes around its center of mass, its area, inertia per unit density and radius. */
function shapeGeom(rects) {
  let area = 0, cx = 0, cy = 0, I = 0;
  for (const [x, y, w, h] of rects) { area += w * h; cx += (x + w / 2) * w * h; cy += (y + h / 2) * w * h; }
  cx /= area; cy /= area;
  const boxes = rects.map(([x, y, w, h]) => { const ox = x + w / 2 - cx, oy = y + h / 2 - cy; I += w * h * ((w * w + h * h) / 12 + ox * ox + oy * oy); return { ox, oy, hx: w / 2, hy: h / 2 }; });
  return { boxes, area, I, rad: Math.max(...boxes.map((b) => Math.hypot(Math.abs(b.ox) + b.hx, Math.abs(b.oy) + b.hy))) };
}
const GEOM = Object.fromEntries(Object.entries(PIECES).map(([k, p]) => [k, shapeGeom(p.rects)]));
const BASE_GEOM = shapeGeom([[0, 0, CONFIG.baseHalf * 2, 3]]);

// ── PHYSICS ─────────────────────────────────────────────────────────────────────────
// In the style of Box2D Lite: box-vs-box contacts with clipping, sequential impulses with
// warm starting (impulses carry over between steps, which keeps stacks steady), and sleeping
// so a settled tower stays put. 1 unit = 1 cell, y up.
const PHYS = { gravity: -13, iterations: 12, step: 1 / 60, friction: 0.65, sleepV: 0.07, sleepS: 0.45, wakeV: 0.25, slop: 0.01, bias: 0.2 };
const newWorld = () => ({ bodies: [], arbs: new Map(), nextId: 1, time: 0, acc: 0, windX: 0, windUntil: 0 });
function addBody(W, geom, x, y, a, opts = {}) {
  const dens = opts.dens || 1;
  const b = { id: opts.id || W.nextId++, x, y, a, vx: 0, vy: 0, w: 0, geom, dens, boxes: geom.boxes, rad: geom.rad, invM: opts.stat ? 0 : 1 / (geom.area * dens), invI: opts.stat ? 0 : 1 / (geom.I * dens),
    im: 0, ii: 0, stat: !!opts.stat, ctl: false, glued: false, sleep: false, slow: 0, fr: PHYS.friction, ...opts.extra };
  W.nextId = Math.max(W.nextId, b.id + 1);
  W.bodies.push(b);
  return b;
}
const fixedBody = (b) => b.stat || b.glued || b.sleep;
const bodySpeed = (b) => Math.hypot(b.vx, b.vy) + Math.abs(b.w) * b.rad;
function worldBoxes(b) {
  const c = Math.cos(b.a), s = Math.sin(b.a);
  return b.boxes.map((q) => ({ x: b.x + c * q.ox - s * q.oy, y: b.y + s * q.ox + c * q.oy, c, s, hx: q.hx, hy: q.hy }));
}
function incidentEdge(hx, hy, px, py, c, s, nx, ny) {
  const lx = -(c * nx + s * ny), ly = -(-s * nx + c * ny);
  const v = Math.abs(lx) > Math.abs(ly)
    ? (lx > 0 ? [[hx, -hy, 3, 4], [hx, hy, 4, 1]] : [[-hx, hy, 1, 2], [-hx, -hy, 2, 3]])
    : (ly > 0 ? [[hx, hy, 4, 1], [-hx, hy, 1, 2]] : [[-hx, -hy, 2, 3], [hx, -hy, 3, 4]]);
  return v.map(([x, y, i2, o2]) => ({ x: px + c * x - s * y, y: py + s * x + c * y, i1: 0, o1: 0, i2, o2 }));
}
function clipSeg(vin, nx, ny, off, edge) {
  const out = [], d0 = nx * vin[0].x + ny * vin[0].y - off, d1 = nx * vin[1].x + ny * vin[1].y - off;
  if (d0 <= 0) out.push(vin[0]);
  if (d1 <= 0) out.push(vin[1]);
  if (d0 * d1 < 0) {
    const t = d0 / (d0 - d1), v = { ...(d0 > 0 ? vin[0] : vin[1]), x: vin[0].x + t * (vin[1].x - vin[0].x), y: vin[0].y + t * (vin[1].y - vin[0].y) };
    if (d0 > 0) { v.i1 = edge; v.i2 = 0; } else { v.o1 = edge; v.o2 = 0; }
    out.push(v);
  }
  return out;
}
/** Box A vs box B (world space): up to 2 contacts {x, y, nx, ny, sep, key}, normal A → B. */
function collideBoxes(A, B, out, keyBase) {
  const dpx = B.x - A.x, dpy = B.y - A.y;
  const dAx = A.c * dpx + A.s * dpy, dAy = -A.s * dpx + A.c * dpy, dBx = B.c * dpx + B.s * dpy, dBy = -B.s * dpx + B.c * dpy;
  const a00 = Math.abs(A.c * B.c + A.s * B.s), a01 = Math.abs(A.s * B.c - A.c * B.s), a10 = a01, a11 = a00;
  const faX = Math.abs(dAx) - A.hx - (a00 * B.hx + a01 * B.hy), faY = Math.abs(dAy) - A.hy - (a10 * B.hx + a11 * B.hy);
  if (faX > 0 || faY > 0) return;
  const fbX = Math.abs(dBx) - (a00 * A.hx + a10 * A.hy) - B.hx, fbY = Math.abs(dBy) - (a01 * A.hx + a11 * A.hy) - B.hy;
  if (fbX > 0 || fbY > 0) return;
  let axis = 0, sep = faX, nx = dAx > 0 ? A.c : -A.c, ny = dAx > 0 ? A.s : -A.s;
  if (faY > 0.95 * sep + 0.01 * A.hy) { axis = 1; sep = faY; nx = dAy > 0 ? -A.s : A.s; ny = dAy > 0 ? A.c : -A.c; }
  if (fbX > 0.95 * sep + 0.01 * B.hx) { axis = 2; sep = fbX; nx = dBx > 0 ? B.c : -B.c; ny = dBx > 0 ? B.s : -B.s; }
  if (fbY > 0.95 * sep + 0.01 * B.hy) { axis = 3; sep = fbY; nx = dBy > 0 ? -B.s : B.s; ny = dBy > 0 ? B.c : -B.c; }
  const ref = axis < 2 ? A : B, inc = axis < 2 ? B : A, fnx = axis < 2 ? nx : -nx, fny = axis < 2 ? ny : -ny, alongX = axis === 0 || axis === 2;
  const front = ref.x * fnx + ref.y * fny + (alongX ? ref.hx : ref.hy);
  const snx = alongX ? -ref.s : ref.c, sny = alongX ? ref.c : ref.s, side = ref.x * snx + ref.y * sny, half = alongX ? ref.hy : ref.hx;
  let cp = clipSeg(incidentEdge(inc.hx, inc.hy, inc.x, inc.y, inc.c, inc.s, fnx, fny), -snx, -sny, -side + half, alongX ? 3 : 2);
  if (cp.length < 2) return;
  cp = clipSeg(cp, snx, sny, side + half, alongX ? 1 : 4);
  if (cp.length < 2) return;
  for (const v of cp) {
    const s = fnx * v.x + fny * v.y - front;
    if (s > 0) continue;
    const f = axis < 2 ? [v.i1, v.o1, v.i2, v.o2] : [v.i2, v.o2, v.i1, v.o1];
    out.push({ x: v.x - s * fnx, y: v.y - s * fny, nx, ny, sep: s, key: keyBase * 4096 + f[0] + f[1] * 8 + f[2] * 64 + f[3] * 512, pn: 0, pt: 0 });
  }
}
/** Find touching pairs, wake sleepers that get hit, and release the steered piece when it touches down. */
function broadPhase(W, events) {
  const B = W.bodies, next = new Map(), wb = new Map(B.map((b) => [b, worldBoxes(b)]));
  for (let i = 0; i < B.length; i++) for (let j = i + 1; j < B.length; j++) {
    let p = B[i], q = B[j];
    if (p.id > q.id) [p, q] = [q, p];
    const key = p.id * 65536 + q.id;
    if (fixedBody(p) && fixedBody(q)) { if (W.arbs.has(key)) next.set(key, W.arbs.get(key)); continue; }
    const dx = q.x - p.x, dy = q.y - p.y, rr = p.rad + q.rad + 0.05;
    if (dx * dx + dy * dy > rr * rr) continue;
    const cs = [], bp = wb.get(p), bq = wb.get(q);
    for (let u = 0; u < bp.length; u++) for (let v = 0; v < bq.length; v++) collideBoxes(bp[u], bq[v], cs, u * 8 + v);
    if (!cs.length) continue;
    const old = W.arbs.get(key);
    if (old) for (const c of cs) { const o = old.cs.find((k) => k.key === c.key); if (o) { c.pn = o.pn; c.pt = o.pt; } }
    next.set(key, { a: p, b: q, cs, fr: Math.sqrt(p.fr * q.fr) });
    for (const [s, o] of [[p, q], [q, p]]) {
      if (s.sleep && !fixedBody(o) && bodySpeed(o) > PHYS.wakeV) { s.sleep = false; s.slow = 0; }
      if (s.ctl && !o.ctl) { s.ctl = false; events.push({ k: "land", b: s, v: bodySpeed(s), x: cs[0].x, y: cs[0].y }); }
    }
  }
  W.arbs = next;
}
/** One fixed step. Returns events ({k: "land"} when the steered piece touches down). */
function stepWorld(W, dt) {
  const events = [];
  W.time += dt;
  broadPhase(W, events);
  const windOn = W.time < W.windUntil;
  for (const b of W.bodies) {
    const fixed = fixedBody(b);
    b.im = fixed ? 0 : b.invM; b.ii = fixed ? 0 : b.invI;
    if (fixed) continue;
    if (b.ctl) { // the falling piece is steered: it slides to its target spot and turn, at its fall speed
      const da = Math.atan2(Math.sin(b.ta - b.a), Math.cos(b.ta - b.a));
      b.vx = Math.max(-9, Math.min(9, (b.tx - b.x) * 14)); b.vy = -b.fall; b.w = Math.max(-9, Math.min(9, da * 16));
      continue;
    }
    b.vy += PHYS.gravity * dt;
    if (windOn) b.vx += W.windX * dt * Math.min(1, b.invM * 4);
    b.vx /= 1 + dt * 0.08; b.vy /= 1 + dt * 0.08; b.w /= 1 + dt * 0.9;
  }
  const arbs = [...W.arbs.values()].filter((A) => A.a.im || A.b.im);
  for (const A of arbs) preStep(A, 1 / dt);
  for (let it = 0; it < (W.iters || PHYS.iterations); it++) for (const A of arbs) applyImpulse(A);
  for (const b of W.bodies) {
    if (fixedBody(b)) continue;
    b.x += b.vx * dt; b.y += b.vy * dt; b.a += b.w * dt;
    if (b.ctl || windOn) { b.slow = 0; continue; }
    if (Math.hypot(b.vx, b.vy) < PHYS.sleepV && Math.abs(b.w) < PHYS.sleepV) { b.slow += dt; if (b.slow > PHYS.sleepS) { b.sleep = true; b.vx = b.vy = b.w = 0; } } else b.slow = 0;
  }
  return events;
}
function preStep(A, invDt) {
  const p = A.a, q = A.b;
  for (const c of A.cs) {
    const r1x = c.x - p.x, r1y = c.y - p.y, r2x = c.x - q.x, r2y = c.y - q.y, rn1 = r1x * c.nx + r1y * c.ny, rn2 = r2x * c.nx + r2y * c.ny;
    c.mn = 1 / (p.im + q.im + p.ii * (r1x * r1x + r1y * r1y - rn1 * rn1) + q.ii * (r2x * r2x + r2y * r2y - rn2 * rn2));
    const tx = c.ny, ty = -c.nx, rt1 = r1x * tx + r1y * ty, rt2 = r2x * tx + r2y * ty;
    c.mt = 1 / (p.im + q.im + p.ii * (r1x * r1x + r1y * r1y - rt1 * rt1) + q.ii * (r2x * r2x + r2y * r2y - rt2 * rt2));
    c.bias = -PHYS.bias * invDt * Math.min(0, c.sep + PHYS.slop);
    const Px = c.pn * c.nx + c.pt * tx, Py = c.pn * c.ny + c.pt * ty; // warm start: last step's impulse
    p.vx -= p.im * Px; p.vy -= p.im * Py; p.w -= p.ii * (r1x * Py - r1y * Px);
    q.vx += q.im * Px; q.vy += q.im * Py; q.w += q.ii * (r2x * Py - r2y * Px);
  }
}
function applyImpulse(A) {
  const p = A.a, q = A.b;
  for (const c of A.cs) {
    const r1x = c.x - p.x, r1y = c.y - p.y, r2x = c.x - q.x, r2y = c.y - q.y;
    let dvx = q.vx - q.w * r2y - p.vx + p.w * r1y, dvy = q.vy + q.w * r2x - p.vy - p.w * r1x;
    let dPn = c.mn * (-(dvx * c.nx + dvy * c.ny) + c.bias);
    const pn0 = c.pn; c.pn = Math.max(pn0 + dPn, 0); dPn = c.pn - pn0;
    let Px = dPn * c.nx, Py = dPn * c.ny;
    p.vx -= p.im * Px; p.vy -= p.im * Py; p.w -= p.ii * (r1x * Py - r1y * Px);
    q.vx += q.im * Px; q.vy += q.im * Py; q.w += q.ii * (r2x * Py - r2y * Px);
    dvx = q.vx - q.w * r2y - p.vx + p.w * r1y; dvy = q.vy + q.w * r2x - p.vy - p.w * r1x;
    const tx = c.ny, ty = -c.nx, maxPt = A.fr * c.pn, pt0 = c.pt;
    c.pt = Math.max(-maxPt, Math.min(maxPt, pt0 + c.mt * -(dvx * tx + dvy * ty)));
    Px = (c.pt - pt0) * tx; Py = (c.pt - pt0) * ty;
    p.vx -= p.im * Px; p.vy -= p.im * Py; p.w -= p.ii * (r1x * Py - r1y * Px);
    q.vx += q.im * Px; q.vy += q.im * Py; q.w += q.ii * (r2x * Py - r2y * Px);
  }
}

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'tower-stack',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',

  $("net").textContent = ATTRACT ? "" : net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the match" : ""}`;
  const sp = me.T && me.T.spell && m && m.ph === "play" && me.T.alive && !ATTRACT ? SPELLS[me.T.spell] : null;
  $("spell").hidden = !sp;
  if (sp) { $("spell").firstChild.textContent = sp.icon; $("spell").lastChild.textContent = sp.name + (touchUI ? "" : " (E)"); }
  if (!m) return;
  const early = m.ph === "count" || (m.ph === "play" && Date.now() - m.startAt < 14000 && m.id <= 2);
  $("hint").textContent = ATTRACT || !early ? "" : touchUI ? "Drag to move · tap to turn · flick down to drop · hold your tower above the gold line" : "← → move · ↑ turn · ↓ faster · Space drop · E spell · hold your tower above the gold line";
  $("over").hidden = m.ph !== "over" || ATTRACT;
  if (m.ph !== "over") return;
  const info = (id) => towerInfoAny(m, id), place = [...m.players].sort((a, b) => (b === m.winner) - (a === m.winner) || m.out.includes(a) - m.out.includes(b) || (info(b)?.h || 0) - (info(a)?.h || 0));
  $("oTitle").textContent = !m.winner ? "Draw!" : m.winner === net.sessionId ? "You win!" : `${nameOf(m, m.winner)} wins!`;
  const html = place.map((id) => { const v = info(id); return `<li class="${id === net.sessionId ? "me" : ""}">${esc(nameOf(m, id))}<span>${v && v.w ? fmt(v.w - m.startAt) : m.out.includes(id) ? "KO" : ((v?.h || 0) / 100).toFixed(1) + " m"}</span></li>`; }).join("");
  if ($("places").innerHTML !== html) $("places").innerHTML = html;
  $("oNext").textContent = `Next match in ${Math.max(0, Math.ceil((m.endsAt - Date.now()) / 1000))}s`;
  $("again").textContent = m.ready.includes(net.sessionId) ? "Ready ✓" : "Play again";
  if (overFor === m.id) return;
  overFor = m.id;
  const list = $("board"), won = me.T && me.m === m.id && me.T.wonAt ? me.T.wonAt - m.startAt : 0;
  if (m.winner === net.sessionId) tone(660, 400, "triangle", 0.07);
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (won > 0 ? board.submit(Math.max(0, 600000 - won)).catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${fmt(600000 - e.score)}</span></li>`).join("") : "<li>No towers yet. Be the first to the line.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
/** Any client's view of a tower's result: my sim, the host's bot sims, or the snapshots. */
function towerInfoAny(m, id) {
  if (id === net.sessionId || (isHost() && host.bots.has(id))) return towerInfo(m, id);
  return cached((isBot(m, id) ? "" : "t:") + id, isBot(m, id) ? S.shared[id] : S.entities.players?.[id]?.t, null);
}
$("again").addEventListener("click", () => { if (isHost()) onReady(net.sessionId); else net.send("ready", { r: 1 }); });

/** Two players picked one color (they joined at once), or a bot has mine: the later sessionId picks another. */
function fixColor() {
  const ps = S.entities.players || {}, botColors = (match()?.bots || []).map((b) => b.c);
  if (!Object.entries(ps).some(([id, p]) => id < net.sessionId && p.c === myColor) && !botColors.includes(myColor)) return;
  const taken = new Set([...Object.entries(ps).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...botColors]);
  myColor = COLORS.find((c) => !taken.has(c)) || myColor;
  net.me.set("c", myColor);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches;
const keys = { left: false, right: false, down: false, held: "", heldAt: 0, stepAt: 0 };
const KEYMAP = { ArrowLeft: "left", a: "left", ArrowRight: "right", d: "right", ArrowDown: "down", s: "down", ArrowUp: "rotate", w: "rotate", x: "rotate", z: "ccw", " ": "drop", e: "spell", Shift: "spell" };
addEventListener("keydown", (e) => {
  const k = KEYMAP[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (!k) return;
  e.preventDefault(); unlockAudio();
  if (e.repeat) return;
  if (k === "left" || k === "right") { keys[k] = true; keys.held = k; keys.heldAt = performance.now(); act(k); }
  else if (k === "down") keys.down = true;
  else act(k);
});
addEventListener("keyup", (e) => {
  const k = KEYMAP[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (k === "left" || k === "right") { keys[k] = false; if (keys.held === k) keys.held = keys.left ? "left" : keys.right ? "right" : ""; keys.heldAt = performance.now(); }
  if (k === "down") keys.down = false;
});
addEventListener("blur", () => Object.assign(keys, { left: false, right: false, down: false, held: "" }));
/** Held left/right: one step, a pause (das), then a step every arr ms. */
function repeatKeys(now) {
  if (!keys.held || now - keys.heldAt < CONFIG.das || now < keys.stepAt) return;
  keys.stepAt = now + CONFIG.arr; act(keys.held);
}
// Touch and mouse: drag sideways = half a cell per half-cell of finger travel (measured in my lane's scale), tap = turn, flick down = drop.
const swipe = { id: -1, x: 0, x0: 0, y0: 0, t0: 0, moved: false };
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); Object.assign(swipe, { id: e.pointerId, x: e.clientX, x0: e.clientX, y0: e.clientY, t0: performance.now(), moved: false }); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", (e) => {
  if (e.pointerId !== swipe.id) return;
  const step = Math.max(10, (fx.spots?.get(net.sessionId)?.scale || 30) * 0.5);
  while (e.clientX - swipe.x > step) { act("right"); swipe.x += step; swipe.moved = true; }
  while (swipe.x - e.clientX > step) { act("left"); swipe.x -= step; swipe.moved = true; }
  keys.down = e.clientY - swipe.y0 > 40 && Math.abs(e.clientX - swipe.x0) < 40; if (keys.down) swipe.moved = true;
});
cv.addEventListener("pointerup", (e) => {
  if (e.pointerId !== swipe.id) return;
  swipe.id = -1; keys.down = false;
  const dx = e.clientX - swipe.x0, dy = e.clientY - swipe.y0, ms = performance.now() - swipe.t0;
  if (dy > 50 && dy > Math.abs(dx) * 1.5 && ms < 300) act("drop");
  else if (!swipe.moved && Math.hypot(dx, dy) < 12) act("rotate");
});
cv.addEventListener("pointercancel", () => { swipe.id = -1; keys.down = false; });
$("spell").addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); unlockAudio(); act("spell"); });
document.addEventListener("touchmove", (e) => { if (!e.target.closest(".card")) e.preventDefault(); }, { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let lastHb = 0, lastHud = 0, lastFrame = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (performance.now() - lastTick > 1000) { hostHold = performance.now() + 700; host.was = false; } // the tab was frozen or in the background: someone else may have hosted meanwhile, so let its state arrive, then adopt it
  lastTick = performance.now(); // not the rAF time: after a long freeze Chrome can stamp the first frame from before it ended
  const dt = Math.max(0, Math.min(0.05, (now - lastFrame) / 1000)); lastFrame = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); }
  if (isHost()) hostTick(Date.now(), dt); else host.was = false;
  const m = match();
  if (m) { myTick(m, dt); if (m.ph !== "play") fixColor(); }
  draw(m, now, dt);
  if (now - lastHud > 150) { lastHud = now; hud(m); }
}

(async function start() {
  if (ATTRACT) Object.assign(CONFIG, { countdownMs: 200, fallSpeed: 4.5, botThinkMs: 450, nextDelayMs: 200, spellEvery: 2, botCastMs: [300, 1200], overMs: 2500, holdMs: 1200 });
  net = await connect();
  net.onState((st) => { S = st; });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  net.on("spell", (msg, from) => { if (msg && typeof msg === "object") spellLanded(match(), { k: String(msg.k), f: String(msg.f || from), m: msg.m, d: msg.d < 0 ? -1 : 1 }); });
  net.on("ready", (msg, from) => { if (isHost()) onReady(from); });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...(match()?.bots || []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) { // the preview starts mid-match: every bot already has a tower going
    const m = writeMatch({ ...newMatch(1), ph: "play", startAt: Date.now() - 20000 });
    [4, 5, 3, 4.5].forEach((tall, i) => { const bot = host.bots.get("bot" + (i + 1)); if (!bot) return; for (let k = 0; k < 60 * 60 && (bot.T.height < tall || bot.T.cur); k++) { botBrain(m, "bot" + (i + 1), bot); towerTick(bot.T, PHYS.step, true); Object.assign(bot.T, { spell: "", hold: 0, wonAt: 0, lives: CONFIG.lives, alive: true }); } });
    host.was = true; host.lastBots = 0; writeBots();
  }
  requestAnimationFrame(frame);
})();
</script>
